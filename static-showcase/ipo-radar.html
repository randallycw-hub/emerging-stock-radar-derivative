<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="IPO 近期進度與重要事件">
  <title>IPO 進度雷達｜盤後市場資訊</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body data-page="ipo" class="ipo-dashboard-page">
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <header class="site-header"><div class="site-header__inner">
    <a class="site-mark" href="./index.html" aria-label="可轉債與興櫃盤後資訊首頁"><span>POST-CLOSE</span><strong>市場資訊台</strong></a>
    <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"><span aria-hidden="true">☰</span><span>選單</span></button>
    <nav id="primary-navigation" class="primary-navigation" aria-label="主要導覽">
      <a data-page-link="home" href="./index.html">首頁</a><a data-page-link="emerging" href="./emerging.html">興櫃市場</a><a data-page-link="ipo" href="./ipo-radar.html" aria-current="page">IPO</a><a data-page-link="bonds" href="./bonds.html">可轉債</a><a data-page-link="data-center" href="./data-center.html">資料中心</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深淺色模式" aria-pressed="false"><span aria-hidden="true">◐</span><span data-theme-label>深色模式</span></button>
  </div></header>

  <main id="main-content" class="page-content ipo-dashboard-page-content" tabindex="-1">
    <header class="page-heading"><p class="kicker">IPO PROGRESS RADAR</p><h1>IPO 進度雷達</h1><p>聚焦近期正式事件與公開進度，快速掌握公司目前所在階段。</p></header>
    <nav class="ipo-context-nav bond-context-nav" aria-label="IPO 功能"><a href="./ipo-radar.html" aria-current="page">IPO 雷達</a><a href="./ipo.html">IPO 時程</a><a href="./ipo-offering.html">競拍／申購</a></nav>

    <section id="ipo-radar-root" class="ledger-section ipo-dashboard" data-page-root="ipo-radar" data-ipo-dashboard="radar" aria-labelledby="ipo-radar-heading">
      <header class="section-heading"><div><p class="section-number">EVENT DESK / VERIFIED SNAPSHOT</p><h2 id="ipo-radar-heading">IPO 進度總覽</h2></div><p id="ipo-radar-update-status" class="update-status" data-ipo-data-status aria-live="polite">資料讀取中</p></header>

      <div id="ipo-radar-summary" class="ipo-radar-summary ipo-dashboard-summary" data-ipo-summary aria-label="IPO 事件概況">
        <button type="button" data-radar-summary="AB" aria-label="篩選送件與審議公司"><span>送件／審議（公司數）</span><strong data-radar-summary-count="AB">— 家公司</strong></button>
        <button type="button" data-radar-summary="C" aria-label="篩選契約與時程公司"><span>契約／時程（公司數）</span><strong data-radar-summary-count="C">— 家公司</strong></button>
        <button type="button" data-radar-summary="D" aria-label="篩選定價與掛牌公司"><span>定價／掛牌（公司數）</span><strong data-radar-summary-count="D">— 家公司</strong></button>
        <article><span>資料日期</span><strong data-radar-data-date>—</strong></article>
      </div>

      <section class="ipo-upcoming" aria-labelledby="ipo-upcoming-heading"><header class="section-heading"><div><p class="section-number">NEXT ON RECORD</p><h2 id="ipo-upcoming-heading">近期重要事件</h2></div></header><div id="ipo-upcoming-grid" class="ranking-grid ipo-upcoming-grid" aria-live="polite"></div></section>

      <div class="ipo-stage-flow ipo-dashboard-stage-filter" aria-label="IPO 階段篩選">
        <button type="button" data-radar-stage="A" data-ipo-stage-filter="A">A 送件觀察</button><button type="button" data-radar-stage="B" data-ipo-stage-filter="B">B 審議進程</button><button type="button" data-radar-stage="C" data-ipo-stage-filter="C">C 契約／時程</button><button type="button" data-radar-stage="D" data-ipo-stage-filter="D">D 定價／掛牌</button>
      </div>

      <form id="ipo-radar-filters" class="filters ipo-filters" aria-label="IPO 進度雷達篩選">
        <label class="search-field"><span>搜尋</span><input id="ipo-radar-search" name="q" type="search" placeholder="公司代碼或名稱"></label>
        <label><span>市場</span><select id="ipo-radar-market" name="market"><option value="all">全部市場</option></select></label>
        <label><span>進度</span><select id="ipo-radar-stage" name="stage"><option value="market">交易事件優先</option><option value="active">所有進行中</option><option value="all">全部進度</option><option value="AB">送件／審議</option><option value="A">A 送件觀察</option><option value="B">B 審議進程</option><option value="C">C 契約／時程</option><option value="D">D 定價／掛牌</option></select></label>
        <label class="mobile-sort-control"><span>排序欄位</span><select id="ipo-radar-sort-field" name="sort"><option value="eventDate">最近事件日</option><option value="company">公司</option><option value="stage">目前進度</option><option value="days">距今天數</option></select></label>
        <button id="ipo-radar-sort-direction" class="sort-direction" type="button" aria-label="切換排序方向" data-direction="asc">近到遠 ↑</button>
        <output id="ipo-radar-result-count" aria-live="polite">—</output>
      </form>

      <div class="ipo-table-shell ipo-dashboard-table" data-ipo-table><table class="ipo-table"><thead><tr>
        <th aria-sort="none"><button type="button" data-radar-sort="company">公司／市場 <span aria-hidden="true"></span></button></th>
        <th aria-sort="none"><button type="button" data-radar-sort="stage">目前進度 <span aria-hidden="true"></span></button></th>
        <th>最近事件</th>
        <th aria-sort="none"><button type="button" data-radar-sort="eventDate">事件日期 <span aria-hidden="true"></span></button></th>
        <th aria-sort="none"><button type="button" data-radar-sort="days">距今天數 <span aria-hidden="true"></span></button></th>
        <th>定價狀態</th>
        <th>送件日</th>
        <th>審議日</th>
        <th>董事會日</th>
        <th>契約日</th>
        <th>競拍日</th>
        <th>申購日</th>
        <th>掛牌日</th>
        <th>階段經過</th>
        <th>資料日期</th>
      </tr></thead><tbody id="ipo-radar-table-body"><tr><td colspan="15" class="empty-cell">IPO 進度雷達讀取中</td></tr></tbody></table></div>
      <div id="ipo-radar-card-list" class="ipo-card-list" data-ipo-responsive-cards aria-live="polite"></div>
      <nav id="ipo-radar-pagination" class="pagination" aria-label="IPO 進度雷達分頁"></nav>
      <p class="data-error" data-page-error hidden role="status"></p>
    </section>
  </main>

  <footer class="footer">市場資訊台 · 僅整理公開資訊，不構成投資建議。</footer>
  <script type="module" src="./assets/site-shell.js"></script>
  <script type="module" src="./assets/ipo-radar-page.js"></script>
</body>
</html>
