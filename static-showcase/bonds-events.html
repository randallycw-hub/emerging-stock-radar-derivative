  <main id="main-content" class="page-content" tabindex="-1">
    <header class="page-heading"><p class="kicker">CONVERTIBLE BONDS / EVENT CALENDAR</p><h1>事件行事曆</h1><p>集中查看停止轉換、提前贖回、賣回、到期、轉換價調整、Reset 與新掛牌等已公布事件。</p></header>
    <nav class="bond-context-nav" aria-label="可轉債功能"><a href="./bonds.html">市場總覽</a><a href="./bonds-filter.html">全部 CB</a><a href="./bonds-issuance.html">發行進度</a><a href="./bonds-events.html" aria-current="page">事件行事曆</a><a href="./bonds-stats.html">市場統計</a></nav>
    <section class="ledger-section" data-bond-events-root aria-labelledby="bond-events-heading"><header class="section-heading"><div><p class="section-number">VERIFIED EVENT DESK</p><h2 id="bond-events-heading">可轉債事件</h2></div><p id="bond-events-count" class="update-status" aria-live="polite">讀取中</p></header>
      <form id="bond-events-form" class="filters cb-event-filters" role="search" aria-label="可轉債事件篩選"><label><span>顯示範圍</span><select name="range"><option value="today">今日</option><option value="7">未來 7 日</option><option value="30" selected>未來 30 日</option><option value="month">本月</option></select></label><label><span>事件類型</span><select name="type"><option value="all">全部事件</option><option value="conversion_suspension">停止轉換</option><option value="redemption">提前贖回</option><option value="put">賣回</option><option value="maturity">到期</option><option value="conversion_adjustment">轉換價調整</option><option value="reset">Reset</option><option value="listing">新掛牌</option></select></label><label><span>搜尋</span><input name="q" type="search" inputmode="search" autocomplete="off" placeholder="CB 代碼、名稱或公司"></label></form>
