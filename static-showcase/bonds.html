<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="可轉債盤後市場資訊">
  <title>可轉債｜盤後市場資訊</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body data-page="bonds">
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-mark" href="./index.html" aria-label="可轉債與興櫃盤後資訊首頁">
        <span>POST-CLOSE</span>
        <strong>市場資訊台</strong>
      </a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span aria-hidden="true">☰</span>
        <span>選單</span>
      </button>
      <nav id="primary-navigation" class="primary-navigation" aria-label="主要導覽">
        <a data-page-link="home" href="./index.html">首頁</a>
        <a data-page-link="bonds" href="./bonds.html" aria-current="page">可轉債</a>
        <a data-page-link="emerging" href="./emerging.html">興櫃市場</a>
        <a data-page-link="ipo-radar" href="./ipo-radar.html">IPO 雷達</a>
        <a data-page-link="ipo" href="./ipo.html">IPO 時程</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深淺色模式" aria-pressed="false">
        <span aria-hidden="true">◐</span>
        <span data-theme-label>深色模式</span>
      </button>
    </div>
  </header>

  <main id="main-content" class="page-content" tabindex="-1">
    <header class="page-heading">
      <p class="kicker">CONVERTIBLE BONDS</p>
      <h1>可轉債盤後資訊</h1>
      <p>整理可轉債條款、盤後行情與同日估值結果。</p>
    </header>
    <section id="bond-market-root" class="ledger-section" data-page-root="bonds" aria-labelledby="bond-market-heading">
      <header class="section-heading">
        <div><p class="section-number">MARKET WORKSPACE</p><h2 id="bond-market-heading">可轉債市場資料</h2></div>
        <p id="bond-update-status" class="update-status" aria-live="polite">盤後資料讀取中</p>
      </header>

      <div id="bond-list-view">
        <form class="filters" id="bond-filters" aria-label="可轉債篩選">
          <label class="search-field">
            <span>搜尋</span>
            <input id="bond-search" name="q" type="search" placeholder="5/6 位代碼、債券名稱或發行人">
          </label>
          <label class="archive-toggle"><input id="bond-archive-toggle" name="archived" type="checkbox"> 顯示封存可轉債</label>
          <button id="bond-clear-filter" type="button" hidden>清除搜尋</button>
          <output id="bond-result-count" aria-live="polite">—</output>
        </form>
        <p class="table-hint">點選可比較欄位：遞增、遞減、取消排序。</p>

        <div class="bond-table-shell">
          <table class="bond-table">
            <thead><tr>
              <th aria-sort="none"><button type="button" data-sort-key="bondCode">CB 代碼／名稱 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="cbClose">CB 收盤 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="conversionValue">轉換價值 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="premiumRate">轉換溢價率 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="stockClose">標的股收盤 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="currentConversionPrice">目前轉換價 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="remainingRatio">流通餘額比例 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="nextEventDate">下一事件 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort-key="valuationDate">資料日期 <span aria-hidden="true"></span></button></th>
              <th aria-sort="none">資料品質</th>
            </tr></thead>
            <tbody id="bond-table-body"><tr><td colspan="10" class="empty-cell">盤後資料讀取中</td></tr></tbody>
          </table>
        </div>
        <div id="bond-card-list" class="bond-card-list" aria-live="polite"></div>
        <nav id="bond-pagination" class="pagination" aria-label="可轉債分頁"></nav>
      </div>

      <section id="bond-workbench" class="workbench" data-detail-url-param="bond" data-chart-default-period="day" data-chart-default-range="6M" hidden aria-live="polite"></section>
      <p class="data-error" data-page-error hidden role="status"></p>
    </section>
  </main>

  <footer class="footer">市場資訊台 · 僅整理公開資訊，不構成投資建議。</footer>
  <script type="module" src="./assets/site-shell.js"></script>
  <script type="module" src="./assets/bonds-page.js"></script>
</body>
</html>
