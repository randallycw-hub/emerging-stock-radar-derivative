name: Market data refresh

on:
  schedule:
    - cron: "15 8 * * 1-5" # FAST, 16:15 Asia/Taipei
    - cron: "45 9 * * 1-5" # OFFICIAL, 17:45 Asia/Taipei
    - cron: "30 14 * * *" # EVENT, 22:30 Asia/Taipei
    - cron: "30 23 * * 0-4" # RECONCILE, 07:30 Asia/Taipei
    - cron: "0 2 * * 6" # WEEKLY, Saturday 10:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        type: choice
        options: [FAST, OFFICIAL, EVENT, RECONCILE, WEEKLY]

permissions:
  contents: write

concurrency:
  group: market-data-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: context
        shell: bash
        run: |
          schedule="${{ github.event.schedule }}"
          mode="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$schedule" in
              "15 8 * * 1-5") mode=FAST ;;
              "45 9 * * 1-5") mode=OFFICIAL ;;
              "30 14 * * *") mode=EVENT ;;
              "30 23 * * 0-4") mode=RECONCILE ;;
              "0 2 * * 6") mode=WEEKLY ;;
              *) exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "data_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Validate approved candidate
        shell: bash
        run: |
          case "${{ steps.context.outputs.mode }}" in
            FAST|OFFICIAL)
              node scripts/run-nightly-market-refresh.mjs --date "${{ steps.context.outputs.data_date }}"
              ;;
            EVENT)
              node scripts/refresh-static-ipo-snapshot.mjs
              ;;
            RECONCILE|WEEKLY)
              node --test tests/pipeline/refresh-mode.test.mjs
              ;;
            *) exit 1 ;;
          esac
      - name: Build verified static snapshot
        if: ${{ steps.context.outputs.mode == 'FAST' || steps.context.outputs.mode == 'OFFICIAL' || steps.context.outputs.mode == 'EVENT' }}
        run: npm run build
      - name: Commit verified public snapshot
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (steps.context.outputs.mode == 'FAST' || steps.context.outputs.mode == 'OFFICIAL' || steps.context.outputs.mode == 'EVENT') }}
        env:
          DATA_DATE: ${{ steps.context.outputs.data_date }}
        shell: bash
        run: |
          # Generation artifacts are normally ignored locally. Force-add the
          # verified pointer and every file it references as one atomic commit.
          git add -f -- static-showcase/data
          if git diff --cached --quiet -- static-showcase/data; then
            echo "No verified public snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh verified market snapshot ${DATA_DATE}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
