name: Deploy public showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "static-showcase/**"
      - "scripts/**"
      - "lib/**"
      - "package*.json"
      - "tests/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:
  schedule:
    # UTC；台北時間為平日 20:30、21:30、23:00。
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 15 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CI: "true"
      UV_THREADPOOL_SIZE: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Taipei date
        id: market-date
        shell: bash
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore partial market collection
        uses: actions/cache/restore@v4
        with:
          path: .cache/official-market
          key: official-market-${{ runner.os }}-${{ steps.market-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            official-market-${{ runner.os }}-${{ steps.market-date.outputs.date }}-
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check whether today's market snapshot is already published
        if: github.event_name == 'schedule'
        id: freshness
        env:
          PUBLIC_MANIFEST_URL: ${{ steps.pages.outputs.base_url }}/data/current.json
        run: node scripts/check-market-refresh-needed.mjs >> "$GITHUB_OUTPUT"
      - name: Refresh verified public datasets
        id: refresh
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.needed == 'true')
        run: npm run snapshot:showcase
      - name: Save partial market collection
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/cache/save@v4
        with:
          path: .cache/official-market
          key: official-market-${{ runner.os }}-${{ steps.market-date.outputs.date }}-${{ github.run_id }}
      - name: Verify website
        if: steps.refresh.outcome == 'success'
        run: npm run test:showcase
      - name: Upload showcase
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-showcase
      - name: Deploy
        if: steps.refresh.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
