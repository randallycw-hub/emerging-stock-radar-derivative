name: Relay approved public sources

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay approved sources to Worker
        env:
          WORKER_INGESTION_TOKEN: ${{ secrets.WORKER_INGESTION_TOKEN }}
          WORKER_INGEST_URL: https://emerging-stock-radar-derivative.randall-ycw.workers.dev/api/admin/ingest-relay
        run: node scripts/relay-approved-sources.mjs
