name: Relay approved public sources

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose relay token metadata
        env:
          WORKER_INGESTION_TOKEN: ${{ secrets.WORKER_INGESTION_TOKEN }}
        run: node -e "const crypto=require('node:crypto'); const t=process.env.WORKER_INGESTION_TOKEN||''; console.log(JSON.stringify({length:t.length,sha256:crypto.createHash('sha256').update(t).digest('hex')}));"
      - name: Probe Worker authentication
        env:
          WORKER_INGESTION_TOKEN: ${{ secrets.WORKER_INGESTION_TOKEN }}
        run: node -e "fetch('https://emerging-stock-radar-derivative.randall-ycw.workers.dev/api/admin/ingest-relay',{method:'POST',headers:{Authorization:'Bearer '+process.env.WORKER_INGESTION_TOKEN,'Content-Type':'application/json'},body:'{}'}).then(async r=>console.log(JSON.stringify({status:r.status,body:await r.text()})))"
      - name: Relay approved sources to Worker
        env:
          WORKER_INGESTION_TOKEN: ${{ secrets.WORKER_INGESTION_TOKEN }}
          WORKER_INGEST_URL: https://emerging-stock-radar-derivative.randall-ycw.workers.dev/api/admin/ingest-relay
        run: node scripts/relay-approved-sources.mjs
